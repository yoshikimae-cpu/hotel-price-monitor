name: Hotel Price Monitor

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: "テスト配信を送る"
        required: false
        default: "false"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run hotel script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          RAKUTEN_URL: ${{ secrets.RAKUTEN_URL }}
          JALAN_URL: ${{ secrets.JALAN_URL }}
          TEST_MODE: ${{ github.event.inputs.test }}
        run: |
          python hotel.py
